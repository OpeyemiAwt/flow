<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>FLOW — 3:00 White-Theme Motion Graphics Product Film</title>
  <style>
    :root {
      --bg-white: #FFFFFF;
      --bg-cream: #FBF8F3;
      --ink: #0B0B0B;
      --ink-muted: #5A554C;
      --ink-soft: #8C857B;
      --crimson: #FF1A1A;
      --Solana: #9945FF;
      --Near: #00C08B;
      --Base: #0052FF;
      --Eth: #627EEA;
      --font-sans: -apple-system, BlinkMacSystemFont, "SF Pro Display", "Inter", "Segoe UI", sans-serif;
      --font-serif: "Instrument Serif", "Playfair Display", Georgia, serif;
      --font-mono: "SF Mono", "JetBrains Mono", Menlo, monospace;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      -webkit-font-smoothing: antialiased;
    }

    body {
      background: #111111;
      color: var(--ink);
      font-family: var(--font-sans);
      display: flex;
      flex-direction: column;
      align-items: center;
      min-height: 100vh;
      overflow-x: hidden;
    }

    body.capture-mode {
      background: #FFFFFF;
      margin: 0;
      padding: 0;
      overflow: hidden;
    }

    body.capture-mode .studio-toolbar {
      display: none !important;
    }

    body.capture-mode .viewport-wrap {
      padding: 0 !important;
      width: 1920px !important;
      height: 1080px !important;
    }

    body.capture-mode #stage {
      transform: none !important;
      border-radius: 0 !important;
      box-shadow: none !important;
    }

    .studio-toolbar {
      width: 100%;
      max-width: 1560px;
      padding: 12px 24px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 16px;
      color: #FFFFFF;
    }

    .toolbar-btn {
      padding: 8px 16px;
      border-radius: 999px;
      border: 1px solid rgba(255,255,255,0.18);
      background: rgba(255,255,255,0.08);
      color: #FFFFFF;
      font-size: 13px;
      font-weight: 600;
      cursor: pointer;
    }

    .toolbar-btn.primary {
      background: var(--crimson);
      border-color: #FF5252;
    }

    .viewport-wrap {
      display: flex;
      justify-content: center;
      align-items: center;
      padding: 6px 20px;
    }

    /* 1920x1080 Pure White Motion Design Canvas */
    #stage {
      position: relative;
      width: 1920px;
      height: 1080px;
      background: radial-gradient(circle at 50% 42%, #FFFFFF 0%, #FDFBF7 62%, #F6F1E8 100%);
      overflow: hidden;
      transform-origin: top center;
      border-radius: 16px;
      box-shadow: 0 28px 80px rgba(0,0,0,0.45);
    }

    /* Subtle Motion-Graphics Dot Grid (ClickUp / Reference style) */
    .mg-grid {
      position: absolute;
      inset: 0;
      background-image:
        radial-gradient(rgba(11, 11, 11, 0.055) 1.25px, transparent 1.25px);
      background-size: 36px 36px;
      pointer-events: none;
    }

    /* Soft Drifting Pastel / Brand Aura Blooms */
    .aura-bloom {
      position: absolute;
      border-radius: 50%;
      filter: blur(85px);
      pointer-events: none;
    }

    /* Liquid Glass Pill & Button System (Exact User Spec) */
    .liquid-glass-nav {
      display: inline-flex;
      align-items: center;
      gap: 8px;
      padding: 8px 12px;
      border-radius: 999px;
      background: linear-gradient(180deg, rgba(242, 239, 233, 0.92) 0%, rgba(232, 227, 218, 0.88) 100%);
      border: 1.5px solid rgba(255, 255, 255, 0.95);
      box-shadow:
        0 12px 32px rgba(15, 15, 15, 0.08),
        inset 0 2px 3px rgba(255, 255, 255, 0.98),
        inset 0 -1px 2px rgba(0, 0, 0, 0.05);
      backdrop-filter: blur(20px);
    }

    .nav-tab {
      position: relative;
      display: inline-flex;
      align-items: center;
      gap: 10px;
      padding: 11px 22px;
      border-radius: 999px;
      font-size: 16px;
      font-weight: 600;
      color: #6B665E;
      transition: all 0.25s cubic-bezier(0.22, 1, 0.36, 1);
    }

    .nav-tab.active {
      background: linear-gradient(180deg, #FFFFFF 0%, #F8F7F4 100%);
      color: #0B0B0B;
      font-weight: 700;
      box-shadow:
        0 6px 18px rgba(0, 0, 0, 0.09),
        0 1px 3px rgba(0, 0, 0, 0.06),
        inset 0 2px 2px #FFFFFF;
      border: 1px solid rgba(255, 255, 255, 0.98);
    }

    .liquid-btn {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 10px;
      padding: 13px 26px;
      border-radius: 999px;
      font-size: 16px;
      font-weight: 650;
      background: linear-gradient(180deg, #FFFFFF 0%, #F4F1EA 100%);
      color: #0B0B0B;
      border: 1.5px solid #FFFFFF;
      box-shadow:
        0 10px 26px rgba(0, 0, 0, 0.08),
        inset 0 2px 3px rgba(255, 255, 255, 1),
        inset 0 -1px 2px rgba(0, 0, 0, 0.05);
    }

    .liquid-btn.dark {
      background: linear-gradient(180deg, #222222 0%, #0B0B0B 100%);
      color: #FFFFFF;
      border: 1.5px solid rgba(255, 255, 255, 0.28);
      box-shadow:
        0 12px 28px rgba(11, 11, 11, 0.22),
        inset 0 1.5px 2px rgba(255, 255, 255, 0.35);
    }

    .liquid-round-btn {
      width: 48px;
      height: 48px;
      border-radius: 50%;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      background: linear-gradient(180deg, #FFFFFF 0%, #F3EFE7 100%);
      border: 1.5px solid #FFFFFF;
      box-shadow:
        0 8px 20px rgba(0, 0, 0, 0.08),
        inset 0 2px 3px #FFFFFF;
    }

    /* 3D UI Window Container (ClickUp Reference Style) */
    .ui-window-3d {
      position: absolute;
      width: 1520px;
      height: 880px;
      left: 200px;
      top: 100px;
      background: #FBF8F3;
      border-radius: 32px;
      border: 2px solid #FFFFFF;
      box-shadow:
        0 40px 110px rgba(11, 11, 11, 0.11),
        0 15px 45px rgba(255, 26, 26, 0.07),
        0 0 0 1px rgba(11, 11, 11, 0.05);
      overflow: hidden;
      transform-style: preserve-3d;
    }

    /* Pop-Out 3D Elevated Card */
    .pop-card {
      background: #FFFFFF;
      border-radius: 24px;
      border: 1.5px solid rgba(11, 11, 11, 0.06);
      box-shadow:
        0 28px 68px rgba(11, 11, 11, 0.14),
        0 6px 20px rgba(255, 26, 26, 0.08);
    }

    /* Skeleton Shimmer */
    .skeleton-box {
      background: linear-gradient(90deg, #ECE7DF 0%, #F6F3ED 50%, #ECE7DF 100%);
      background-size: 200% 100%;
      border-radius: 12px;
    }
  </style>
</head>
<body>
  <div class="studio-toolbar">
    <div style="display:flex; align-items:center; gap:14px;">
      <img src="../assets/brand/flow-logo-white.png" style="height:26px;" alt="flow" />
      <span style="font-size:13px; color:#A3A3A3; font-weight:600;">3:00 White-Theme Motion Design Film · 80% Live UI / 20% Kinetic Text · Calm Female Voiceover</span>
    </div>
    <div style="display:flex; align-items:center; gap:10px;">
      <button id="play-btn" class="toolbar-btn primary" onclick="togglePlay()">▶ Play 3:00 Film</button>
      <button class="toolbar-btn" onclick="seekTo(12.0)">✨ Logo Reveal (0:12)</button>
      <button class="toolbar-btn" onclick="seekTo(33.5)">⚡ Auto Setup (0:34)</button>
      <button class="toolbar-btn" onclick="seekTo(44.0)">🏠 Dashboard & Nav (0:44)</button>
      <button class="toolbar-btn" onclick="seekTo(66.0)">↙ Receive SOL/NEAR (1:06)</button>
      <button class="toolbar-btn" onclick="seekTo(82.0)">🔁 Live Convert (1:22)</button>
      <button class="toolbar-btn" onclick="seekTo(122.0)">🌐 SOL → NEAR Checkout (2:02)</button>
      <input id="scrubber" type="range" min="0" max="180" step="0.04" value="0" style="width:220px; accent-color:#FF1A1A;" oninput="seekTo(parseFloat(this.value))" />
      <span id="time-display" style="font-family:var(--font-mono); font-size:13px; min-width:96px; text-align:right;">00:00 / 03:00</span>
    </div>
  </div>

  <div class="viewport-wrap">
    <div id="stage">
      <div class="mg-grid"></div>
      <div id="aura-1" class="aura-bloom" style="width:680px; height:680px; background:rgba(255,26,26,0.085); left:18%; top:12%;"></div>
      <div id="aura-2" class="aura-bloom" style="width:640px; height:640px; background:rgba(153,69,255,0.075); right:14%; bottom:10%;"></div>
      <div id="aura-3" class="aura-bloom" style="width:580px; height:580px; background:rgba(0,192,139,0.07); left:42%; bottom:16%;"></div>
      <div id="canvas-root" style="position:absolute; inset:0; perspective: 1800px;"></div>
    </div>
  </div>

  <audio id="vo-audio" src="../audio-3min/flow-3min-female-vo.m4a" preload="auto"></audio>

  <script>
    // Mathematical easing & spring helpers for genuine 60fps motion graphics
    const clamp = (v, min = 0, max = 1) => Math.max(min, Math.min(max, v));
    const prog = (t, start, dur) => clamp((t - start) / dur, 0, 1);
    const easeOutCubic = (x) => 1 - Math.pow(1 - x, 3);
    const easeOutExpo = (x) => (x === 1 ? 1 : 1 - Math.pow(2, -10 * x));
    const easeInOutCubic = (x) => (x < 0.5 ? 4 * x * x * x : 1 - Math.pow(-2 * x + 2, 3) / 2);
    const springOut = (x) => {
      const c4 = (2 * Math.PI) / 3.2;
      return x <= 0 ? 0 : x >= 1 ? 1 : Math.pow(2, -9 * x) * Math.sin((x * 8.5 - 0.75) * c4) + 1;
    };
    const lerp = (a, b, p) => a + (b - a) * p;

    // SVG Icons (Enlarged, crisp, Apple-style)
    const ICONS = {
      home: `<svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 10.5L12 3l9 7.5V20a1 1 0 0 1-1 1h-5v-6H9v6H4a1 1 0 0 1-1-1v-9.5z"/></svg>`,
      send: `<svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M7 17L17 7M17 7H8M17 7V16"/></svg>`,
      receive: `<svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M17 7L7 17M7 17H16M7 17V8"/></svg>`,
      request: `<svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M10 13a5 5 0 0 0 7.54.54l3-3a5 5 0 0 0-7.07-7.07l-1.72 1.71"/><path d="M14 11a5 5 0 0 0-7.54-.54l-3 3a5 5 0 0 0 7.07 7.07l1.71-1.71"/></svg>`,
      activity: `<svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><polyline points="22 12 18 12 15 21 9 3 6 12 2 12"/></svg>`,
      plus: `<svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round"><line x1="12" y1="5" x2="12" y2="19"/><line x1="5" y1="12" x2="19" y2="12"/></svg>`,
      bell: `<svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="#0B0B0B" stroke-width="2.1" stroke-linecap="round" stroke-linejoin="round"><path d="M18 8A6 6 0 0 0 6 8c0 7-3 9-3 9h18s-3-2-3-9"/><path d="M13.73 21a2 2 0 0 1-3.46 0"/></svg>`,
      eyeOpen: `<svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="#5A554C" stroke-width="2.1" stroke-linecap="round"><path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"/><circle cx="12" cy="12" r="3"/></svg>`,
      eyeClosed: `<svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="#FF1A1A" stroke-width="2.1" stroke-linecap="round"><path d="M17.94 17.94A10.07 10.07 0 0 1 12 20c-7 0-11-8-11-8a18.45 18.45 0 0 1 5.06-5.94M9.9 4.24A9.12 9.12 0 0 1 12 4c7 0 11 8 11 8a18.5 18.5 0 0 1-2.16 3.19m-6.72-1.07a3 3 0 1 1-4.24-4.24"/><line x1="1" y1="1" x2="23" y2="23"/></svg>`,
      aiMascot: `
        <svg width="28" height="28" viewBox="0 0 36 36" fill="none">
          <circle cx="18" cy="18" r="14" fill="url(#mascotGrad)" />
          <rect x="9" y="12" width="18" height="12" rx="6" fill="#0B0B0B" />
          <circle cx="14.5" cy="18" r="2.2" fill="#FFFFFF" />
          <circle cx="21.5" cy="18" r="2.2" fill="#FF4D4D" />
          <path d="M18 4V7" stroke="#FF1A1A" stroke-width="2.4" stroke-linecap="round"/>
          <circle cx="18" cy="3.5" r="2" fill="#FF1A1A"/>
          <defs>
            <linearGradient id="mascotGrad" x1="4" y1="4" x2="32" y2="32" gradientUnits="userSpaceOnUse">
              <stop stop-color="#FFFFFF"/>
              <stop offset="1" stop-color="#F2E9DC"/>
            </linearGradient>
          </defs>
        </svg>
      `,
      googleAvatar: `
        <div style="width:36px; height:36px; border-radius:50%; background:linear-gradient(135deg, #0B0B0B 0%, #FF1A1A 100%); color:#FFF; font-weight:700; font-size:15px; display:flex; align-items:center; justify-content:center; border:2px solid #FFF; box-shadow:0 2px 8px rgba(0,0,0,0.12);">OM</div>
      `,
      cursorHand: `
        <svg width="42" height="42" viewBox="0 0 36 36" fill="none" style="filter:drop-shadow(0 8px 16px rgba(0,0,0,0.26));">
          <path d="M13 6.5C13 5.12 14.12 4 15.5 4C16.88 4 18 5.12 18 6.5V15H19.5C20.88 15 22 16.12 22 17.5V18H23.5C24.88 18 26 19.12 26 20.5V24.5C26 28.64 22.64 32 18.5 32H14.5C11.5 32 9.2 30.1 8.1 27.4L5.8 21.8C5.2 20.4 5.9 18.8 7.3 18.3C8.5 17.9 9.8 18.4 10.4 19.5L13 24V6.5Z" fill="#FFFFFF" stroke="#0B0B0B" stroke-width="2.2" stroke-linejoin="round"/>
        </svg>
      `,
      cursorArrow: `
        <svg width="38" height="38" viewBox="0 0 32 32" fill="none" style="filter:drop-shadow(0 8px 16px rgba(0,0,0,0.25));">
          <path d="M6 4L26 14.5L16.5 17.5L12.5 27L6 4Z" fill="#0B0B0B" stroke="#FFFFFF" stroke-width="2.4" stroke-linejoin="round"/>
        </svg>
      `
    };

    function renderCursor(x, y, clicking = false, useHand = true) {
      const scale = clicking ? 0.86 : 1.0;
      return `
        <div style="position:absolute; left:${x.toFixed(1)}px; top:${y.toFixed(1)}px; transform:translate(-10px, -8px) scale(${scale}); z-index:200; pointer-events:none;">
          ${clicking ? `<div style="position:absolute; left:-18px; top:-18px; width:56px; height:56px; border-radius:50%; border:3px solid #FF1A1A; background:rgba(255,26,26,0.16);"></div>` : ""}
          ${useHand ? ICONS.cursorHand : ICONS.cursorArrow}
        </div>
      `;
    }

    // Shared Top Header Bar with Centered Apple-Style Liquid Glass Nav
    function renderTopNav(activeTab = "home", highlightAi = false, highlightProfile = false) {
      const tabs = [
        { id: "home", label: "Home", icon: ICONS.home },
        { id: "send", label: "Send", icon: ICONS.send },
        { id: "receive", label: "Receive", icon: ICONS.receive },
        { id: "request", label: "Request", icon: ICONS.request },
        { id: "activity", label: "Activity", icon: ICONS.activity },
      ];
      return `
        <div style="display:flex; align-items:center; justify-content:space-between; padding:22px 42px; border-bottom:1px solid rgba(11,11,11,0.05); background:rgba(251,248,243,0.88); backdrop-filter:blur(16px);">
          <!-- Brand Logo (Light Theme) -->
          <div style="display:flex; align-items:center; gap:12px;">
            <img src="../assets/brand/flow-logo.png" style="height:38px;" alt="flow" />
          </div>

          <!-- Centered Enlarged Apple-Style Liquid Glass Navigation -->
          <div class="liquid-glass-nav">
            ${tabs.map(tb => `
              <div class="nav-tab ${activeTab === tb.id ? 'active' : ''}">
                ${tb.icon}
                <span>${tb.label}</span>
              </div>
            `).join("")}
          </div>

          <!-- Right Liquid Glass Round AI Mascot + Notification + Google Profile -->
          <div style="display:flex; align-items:center; gap:12px;">
            <div class="liquid-round-btn" style="${highlightAi ? 'box-shadow:0 0 0 4px rgba(255,26,26,0.28), 0 10px 24px rgba(255,26,26,0.22); transform:scale(1.08);' : ''}">
              ${ICONS.aiMascot}
            </div>
            <div class="liquid-round-btn">
              ${ICONS.bell}
            </div>
            <div class="liquid-btn" style="padding:6px 14px 6px 8px; gap:10px; ${highlightProfile ? 'box-shadow:0 0 0 4px rgba(255,26,26,0.25);' : ''}">
              ${ICONS.googleAvatar}
              <span style="font-size:15px; font-weight:650;">Opeyemi Moses</span>
            </div>
          </div>
        </div>
      `;
    }

    // ============================================================================
    // SCENE 1 (0.0s - 12.0s): KINETIC TYPOGRAPHY + CONCENTRIC ORBITAL RINGS (ref1 & ref3)
    // ============================================================================
    function renderScene01Hook(t) {
      // Sub-beat A (0.0s - 3.6s): "Crypto payments today feel [disconnected.]" with selection box & corner handles
      if (t < 3.6) {
        const pIn = easeOutCubic(prog(t, 0.1, 0.9));
        const pBox = easeInOutCubic(prog(t, 1.1, 1.1));
        const blur = (1 - pIn) * 14;
        return `
          <div style="position:absolute; inset:0; display:flex; align-items:center; justify-content:center;">
            <div style="display:flex; align-items:center; gap:20px; font-size:74px; font-weight:750; letter-spacing:-0.035em; color:#0B0B0B; filter:blur(${blur.toFixed(1)}px); opacity:${pIn.toFixed(2)}; transform:scale(${lerp(0.92, 1.03, prog(t, 0, 3.6)).toFixed(3)});">
              <span>Crypto payments today feel</span>
              <div style="position:relative; display:inline-block; padding:4px 16px;">
                <!-- Selection highlight box (ref1/ref3 style) -->
                <div style="position:absolute; left:0; top:4px; bottom:4px; width:${(pBox * 100).toFixed(1)}%; background:rgba(255, 26, 26, 0.13); border:2.5px solid #FF1A1A; border-radius:6px;">
                  <div style="position:absolute; left:-7px; top:-7px; width:12px; height:12px; border-radius:50%; background:#FF1A1A;"></div>
                  <div style="position:absolute; right:-7px; bottom:-7px; width:12px; height:12px; border-radius:50%; background:#FF1A1A;"></div>
                </div>
                <span style="position:relative; z-index:2; color:#FF1A1A;">disconnected.</span>
              </div>
            </div>
          </div>
        `;
      }

      // Sub-beat B (3.6s - 8.4s): Concentric Rings with Solana (SOL) & NEAR tokens + floating UI thought cards (ref1 & ref3)
      if (t < 8.4) {
        const lt = t - 3.6;
        const pRing = easeOutCubic(prog(lt, 0, 1.0));
        const rot = lt * 26;
        const tokens = [
          { name: "SOL", chain: "Solana", img: "../assets/tokens/sol.png", r: 210, a: rot + 20, color: "#9945FF" },
          { name: "NEAR", chain: "NEAR Protocol", img: "../assets/tokens/near.png", r: 210, a: rot + 200, color: "#00C08B" },
          { name: "USDC", chain: "Base", img: "../assets/tokens/usdc.png", r: 340, a: -rot * 0.8 + 65, color: "#0052FF" },
          { name: "ETH", chain: "Ethereum", img: "../assets/tokens/eth.png", r: 340, a: -rot * 0.8 + 245, color: "#627EEA" },
          { name: "USDT", chain: "Solana / NEAR", img: "../assets/tokens/usdt.png", r: 450, a: rot * 0.6 + 135, color: "#26A17B" },
        ];
        return `
          <div style="position:absolute; inset:0; display:flex; align-items:center; justify-content:center; transform:scale(${lerp(0.95, 1.06, lt / 4.8).toFixed(3)});">
            <!-- Concentric Glowing Rings on White Canvas -->
            ${[210, 340, 450].map((r, i) => `
              <div style="
                position:absolute;
                width:${r * 2}px;
                height:${r * 2}px;
                border-radius:50%;
                border: 2.5px solid ${i === 0 ? 'rgba(153,69,255,0.28)' : i === 1 ? 'rgba(0,192,139,0.26)' : 'rgba(255,26,26,0.20)'};
                box-shadow: 0 0 40px ${i === 0 ? 'rgba(153,69,255,0.12)' : 'rgba(0,192,139,0.12)'};
                transform: scale(${pRing.toFixed(3)});
              "></div>
            `).join("")}

            <!-- Center Text (ref1 style) -->
            <div style="text-align:center; z-index:20; background:rgba(255,255,255,0.88); padding:26px 44px; border-radius:28px; backdrop-filter:blur(12px); box-shadow:0 16px 40px rgba(0,0,0,0.06);">
              <div style="font-size:22px; font-weight:650; color:#5A554C; margin-bottom:6px;">You hold <span style="color:#9945FF; font-weight:800;">SOL on Solana</span>.</div>
              <div style="font-size:44px; font-weight:800; letter-spacing:-0.03em; color:#0B0B0B;">They want <span style="color:#00A878;">NEAR</span>.</div>
              <div style="font-size:17px; font-weight:600; color:#FF1A1A; margin-top:8px;">Bridges · Gas tokens · Incompatible chains</div>
            </div>

            <!-- Orbiting Token Medallions -->
            ${tokens.map(tk => {
              const rad = (tk.a * Math.PI) / 180;
              const x = Math.cos(rad) * tk.r * pRing;
              const y = Math.sin(rad) * tk.r * pRing;
              return `
                <div class="pop-card" style="
                  position:absolute;
                  left:calc(50% + ${x.toFixed(1)}px - 92px);
                  top:calc(50% + ${y.toFixed(1)}px - 34px);
                  padding:12px 20px;
                  border-radius:999px;
                  display:flex;
                  align-items:center;
                  gap:12px;

                opacity: ${clamp(pCrest * 1.5).toFixed(2)};
                filter: drop-shadow(0 10px 24px rgba(255,26,26,0.28));

            />
            <!-- 3. Real Wordmark Letter Layers (f, l, o, w) -->

                <div style="display:grid; grid-template-columns: 1fr 1fr; gap:12px;">
                  ${tokensGrid.map(tk => `

      // Part 2 (15.5s - 30.0s): Quote + Solana Deposit QR -> Routing via NEAR Intents / 1Click -> 150 NEAR Settled!

      return `
        <div class="ui-window-3d" style="transform: rotateX(5deg) rotateY(-5deg) scale(1.06);">
          <div style="position:absolute; inset:0; display:grid; grid-template-columns: 1fr 1fr; gap:36px; padding:48px 80px; align-items:center;">
            <!-- Left: Live Route Choreography Card (SOL on Solana -> 150 NEAR on NEAR) -->
            <div class="pop-card" style="padding:38px;">
              <div style="font-size:13px; font-weight:800; text-transform:uppercase; letter-spacing:0.08em; color:#00A878; margin-bottom:10px;">Live Cross-Chain Execution</div>
              <h2 style="font-family:var(--font-serif); font-size:44px; font-weight:400; color:#0B0B0B; margin-bottom:24px;">4.88 SOL → 150.00 NEAR</h2>

              <!-- Visual Route Bar -->
              <div style="display:flex; align-items:center; justify-content:space-between; padding:20px 24px; border-radius:20px; background:#FBF8F3; margin-bottom:24px;">

                  <img src="../assets/tokens/near.png" style="width:44px; height:44px; border-radius:50%;" />

              <!-- 4-Stage Real Verification Stepper -->
              <div style="display:flex; flex-direction:column; gap:10px;">
                ${steps.map((label, idx) => `
                  <div style="
                    padding:13px 18px; border-radius:14px;

            <!-- Right: Actual Settled Receipt UI Screenshot / Card -->
            <div class="pop-card" style="padding:18px; overflow:hidden;">
              <img
                src="${stepIdx < 3 ? '../assets/ui/18-public-guest-checkout-deposit.png' : '../assets/ui/19-public-guest-checkout-settled.png'}"
                style="width:100%; height:540px; object-fit:cover; object-position:top; border-radius:18px;"
              />

          </div>
        </div>
      `;
    }

    // ============================================================================
    // SCENE 11 (152.0s - 172.0s): VERIFIED ON-CHAIN ACTIVITY & FLOW AI ASSISTANT
    // ============================================================================
    function renderScene11ActivityAndAi(t) {
      const lt = t - 152.0; // 0 .. 20.0s
      const showAiDrawer = lt >= 9.0;
      const pAi = springOut(prog(lt, 9.0, 1.0));

      return `
        <div class="ui-window-3d" style="transform: rotateX(6deg) rotateY(-4deg) scale(1.05);">
          ${renderTopNav("activity", showAiDrawer, false)}

          <div style="display:grid; grid-template-columns: 1fr 1fr; gap:32px; padding:36px 80px; align-items:start;">
            <!-- Left Card: Verified On-Chain Activity -->
            <div class="pop-card" style="padding:34px; border:2px solid ${!showAiDrawer ? '#00C08B' : 'transparent'};">
              <div style="font-size:12px; font-weight:800; text-transform:uppercase; letter-spacing:0.08em; color:#00A878; margin-bottom:6px;">Verified On-Chain Activity</div>
              <h3 style="font-family:var(--font-serif); font-size:36px; font-weight:400; color:#0B0B0B; margin-bottom:18px;">Transaction History</h3>

              <div style="display:flex; flex-direction:column; gap:12px;">
                <div style="padding:16px 18px; border-radius:16px; background:#FBF8F3; border:1.5px solid rgba(0,192,139,0.35); display:flex; justify-content:space-between; align-items:center;">
                  <div>
                    <div style="font-size:16px; font-weight:800; color:#0B0B0B;">Payment Link Settled (SOL → NEAR)</div>
                    <div style="font-size:13px; color:#6B665E;">4.88 SOL paid on Solana · Confirmed on NEAR</div>
                  </div>
                  <span style="font-family:var(--font-mono); font-size:17px; font-weight:800; color:#00A878;">+150.00 NEAR</span>
                </div>

                <div style="padding:16px 18px; border-radius:16px; background:#FBF8F3; display:flex; justify-content:space-between; align-items:center;">
                  <div>
                    <div style="font-size:16px; font-weight:800; color:#0B0B0B;">Instant Convert (SOL → NEAR)</div>
                    <div style="font-size:13px; color:#6B665E;">12.50 SOL swapped via NEAR Intents</div>
                  </div>
                  <span style="font-family:var(--font-mono); font-size:17px; font-weight:800; color:#00A878;">+384.25 NEAR</span>
                </div>

                <div style="padding:16px 18px; border-radius:16px; background:#FBF8F3; display:flex; justify-content:space-between; align-items:center;">
                  <div>
                    <div style="font-size:16px; font-weight:800; color:#0B0B0B;">Direct Receive (Solana Mainnet)</div>
                    <div style="font-size:13px; color:#6B665E;">Indexed directly to permanent SOL address</div>
                  </div>
                  <span style="font-family:var(--font-mono); font-size:17px; font-weight:800; color:#0B0B0B;">+14.20 SOL</span>
                </div>
              </div>
            </div>

            <!-- Right Card: On-Chain Verification Details -> Transitions to Flow AI Assistant -->
            <div class="pop-card" style="padding:34px; border:2px solid ${showAiDrawer ? '#FF1A1A' : 'transparent'}; transform:scale(${showAiDrawer ? lerp(0.96, 1.02, pAi).toFixed(3) : '1.0'});">
              ${showAiDrawer ? `
                <div style="display:flex; align-items:center; gap:12px; margin-bottom:18px;">
                  <div class="liquid-round-btn">${ICONS.aiMascot}</div>
                  <div>
                    <div style="font-size:19px; font-weight:800; color:#0B0B0B;">Flow AI Assistant</div>
                    <div style="font-size:13px; color:#6B665E;">Account-Aware Wallet Assistant</div>
                  </div>
                </div>
                <div style="padding:16px 20px; border-radius:18px; background:#FBF8F3; font-size:15px; color:#0B0B0B; margin-bottom:12px;">
                  <strong>You:</strong> Did my 150 NEAR payment link settle from Solana?
                </div>
                <div style="padding:18px 20px; border-radius:18px; background:#0B0B0B; color:#FFFFFF; font-size:15px; line-height:1.5;">
                  <strong>Flow AI:</strong> Yes! <strong>4.88 SOL</strong> was received on Solana and settled as <strong>150.00 NEAR</strong> into your NEAR Mainnet wallet via NEAR Intents / 1Click.
                </div>
              ` : `
                <div style="font-size:12px; font-weight:800; text-transform:uppercase; letter-spacing:0.08em; color:#6B665E; margin-bottom:6px;">Settlement Receipt</div>
                <h3 style="font-family:var(--font-serif); font-size:36px; font-weight:400; color:#0B0B0B; margin-bottom:18px;">On-Chain Verification</h3>
                <div style="display:flex; flex-direction:column; gap:12px; font-size:15px;">
                  <div style="padding:14px 18px; border-radius:14px; background:#FBF8F3; display:flex; justify-content:space-between;">
                    <span style="color:#6B665E;">Sender Paid</span>
                    <strong style="color:#9945FF;">4.88 SOL (Solana Mainnet)</strong>
                  </div>
                  <div style="padding:14px 18px; border-radius:14px; background:#FBF8F3; display:flex; justify-content:space-between;">
                    <span style="color:#6B665E;">You Received</span>
                    <strong style="color:#00A878;">150.00 NEAR (NEAR Mainnet)</strong>
                  </div>
                  <div style="padding:14px 18px; border-radius:14px; background:#FBF8F3; display:flex; justify-content:space-between;">
                    <span style="color:#6B665E;">Status</span>
                    <strong style="color:#00A878;">Settled & Verified ✓</strong>
                  </div>
                </div>
              `}
            </div>
          </div>

          ${renderCursor(showAiDrawer ? 1236 : 460, showAiDrawer ? 145 : 350, (lt > 8.6 && lt < 9.4), true)}
        </div>
      `;
    }

    // Master Dispatcher for any timestamp t in [0, 180]
    function renderAtTime(t) {
      const root = document.getElementById("canvas-root");
      if (t < 12.0) {
        root.innerHTML = renderScene01Hook(t);
      } else if (t < 22.0) {
        root.innerHTML = renderScene02LogoReveal(t, false);
      } else if (t < 44.0) {
        root.innerHTML = renderScene03Onboarding(t);
      } else if (t < 66.0) {
        root.innerHTML = renderScene04Dashboard(t);
      } else if (t < 82.0) {
        root.innerHTML = renderScene05Receive(t);
      } else if (t < 96.0) {
        root.innerHTML = renderScene06Convert(t);
      } else if (t < 102.0) {
        root.innerHTML = renderScene07MidText(t);
      } else if (t < 122.0) {
        root.innerHTML = renderScene08Request(t);
      } else if (t < 152.0) {
        root.innerHTML = renderScene09And10Checkout(t);
      } else if (t < 172.0) {
        root.innerHTML = renderScene11ActivityAndAi(t);
      } else {
        root.innerHTML = renderScene02LogoReveal(t, true);
      }

      const m = Math.floor(t / 60);
      const s = Math.floor(t % 60);
      const disp = document.getElementById("time-display");
      if (disp) disp.textContent = `${String(m).padStart(2, "0")}:${String(s).padStart(2, "0")} / 03:00`;
      const scrub = document.getElementById("scrubber");
      if (scrub) scrub.value = t;
    }

    // Playback state for interactive browser viewing
    let currentTime = 0;
    let isPlaying = false;
    let rafId = null;
    let lastTs = 0;

    function fitStage() {
      if (document.body.classList.contains("capture-mode")) return;
      const stage = document.getElementById("stage");
      const scale = Math.min((window.innerWidth - 40) / 1920, 0.82);
      stage.style.transform = `scale(${scale})`;
      stage.parentElement.style.height = `${Math.round(1080 * scale) + 16}px`;
    }
    window.addEventListener("resize", fitStage);

    function togglePlay() {
      const audio = document.getElementById("vo-audio");
      const btn = document.getElementById("play-btn");
      isPlaying = !isPlaying;
      if (isPlaying) {
        btn.textContent = "⏸ Pause";
        audio.currentTime = currentTime;
        audio.play().catch(() => {});
        lastTs = performance.now();
        rafId = requestAnimationFrame(tick);
      } else {
        btn.textContent = "▶ Play 3:00 Film";
        audio.pause();
        cancelAnimationFrame(rafId);
      }
    }

    function seekTo(sec) {
      currentTime = clamp(sec, 0, 180);
      const audio = document.getElementById("vo-audio");
      if (audio) audio.currentTime = currentTime;
      renderAtTime(currentTime);
    }

    function tick(now) {
      if (!isPlaying) return;
      const audio = document.getElementById("vo-audio");
      if (audio && !audio.paused) {
        currentTime = audio.currentTime;
      } else {
        currentTime += (now - lastTs) / 1000;
      }
      lastTs = now;
      if (currentTime >= 180) {
        currentTime = 0;
        isPlaying = false;
        document.getElementById("play-btn").textContent = "▶ Play 3:00 Film";
        return;
      }
      renderAtTime(currentTime);
      rafId = requestAnimationFrame(tick);
    }

    // Deterministic hook for Playwright headless frame-by-frame rendering
    window.__setVideoFrame = function(cutName, sec) {
      document.body.classList.add("capture-mode");
      const stage = document.getElementById("stage");
      stage.style.transform = "none";
      renderAtTime(sec);
    };

    fitStage();
    renderAtTime(0);
  </script>
</body>
